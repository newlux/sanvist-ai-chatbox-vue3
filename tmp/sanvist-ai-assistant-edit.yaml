    - data:
        code: "import json\nimport uuid\nfrom datetime import datetime, timedelta,\
          \ timezone\n\ndef main(query: str, user_id: str) -> dict:\n    request_id\
          \ = uuid.uuid4().hex\n    china_tz = timezone(timedelta(hours=8))\n    plan_date\
          \ = (\n        datetime.now(china_tz) + timedelta(days=1)\n    ).date().isoformat()\n\
          \n    payload = {\n        \"schema_version\": \"1.0\",\n        \"delegation_id\"\
          : \"delegate-\" + request_id,\n        \"division\": \"pump\",\n       \
          \ \"capability\": \"dispatch.generate_plan\",\n        \"task_id\": \"task-\"\
          \ + request_id,\n        \"conversation_id\": \"conversation-\" + request_id,\n\
          \        \"user_id\": str(user_id or \"\").strip() or \"dify-demo-user\"\
          ,\n        \"role_id\": \"dispatcher\",\n        \"task_input\": {\n   \
          \         \"plan_date\": plan_date\n        },\n        \"question\": str(query\
          \ or \"\").strip(),\n        \"trace_id\": \"trace-\" + request_id\n   \
          \ }\n\n    return {\n        \"request_json\": json.dumps(payload, ensure_ascii=False)\n\
          \    }"
