    - data:
        code: "import json\n\n\nALLOWED_MODULES = {\n    \"operation\",\n    \"energy\"\
          ,\n    \"risk\",\n}\n\n\ndef main(\n    query: str = \"\",\n    selected_modules:\
          \ str = \"\",\n    script_version: str = \"normal\",\n) -> dict:\n    query\
          \ = str(query or \"\").strip()\n\n    if not query:\n        raise ValueError(\"\
          query 不能为空\")\n\n    try:\n        modules = json.loads(\n            str(\n\
          \                selected_modules\n                or '[\"operation\",\"\
          energy\",\"risk\"]'\n            )\n        )\n    except Exception as exc:\n\
          \        raise ValueError(\n            f\"selected_modules 不是合法 JSON：{exc}\"\
          \n        )\n\n    if not isinstance(modules, list) or not modules:\n  \
          \      raise ValueError(\n            \"selected_modules 必须是非空数组\"\n   \
          \     )\n\n    invalid_modules = [\n        module\n        for module in\
          \ modules\n        if module not in ALLOWED_MODULES\n    ]\n\n    if invalid_modules:\n\
          \        raise ValueError(\n            \"不支持的模块：\"\n            + \",\"\
          .join(invalid_modules)\n        )\n\n    version = str(\n        script_version\
          \ or \"normal\"\n    ).strip().lower()\n\n    if version not in {\"normal\"\
          , \"brief\"}:\n        raise ValueError(\n            \"script_version 仅支持\
          \ normal 或 brief\"\n        )\n\n    payload = {\n        \"query\": query,\n\
          \        \"selected_modules\": modules,\n        \"script_version\": version,\n\
          \    }\n\n    return {\n        \"request_json\": json.dumps(\n        \
          \    payload,\n            ensure_ascii=False,\n        )\n    }"
        code_language: python3
        outputs:
          request_json:
            children: null
            type: string
