          \   }\n\n    answer = (\n        \"任务已经通过 LangGraph 启动。\\n\"\n        f\"\
          - 当前阶段：{stage}\\n\"\n        f\"- 状态说明：{message}\\n\"\n        f\"- delegation_id：{delegation_id}\\\
          n\"\n        f\"- workflow_run_id：{workflow_run_id}\"\n    )\n\n    return\
