<svg width="375" height="118" viewBox="0 0 375 118" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    底部波浪横向流动动画的遮罩素材（alpha mask，颜色无关，只取形状）。
    与静态稿 voice-listening-wave.svg（Ardot 11101:691）同尺寸：375×118 @2x = 750×236rpx。
    路径为首尾相接的正弦形轮廓：
      Q + 3×T 镜像连续，起点 (0,95) 与终点 (375,95) 的 y 和切线斜率完全一致，
      repeat-x 平铺后无缝衔接，可供 mask-position 横向位移循环。
    波峰 y≈88、波谷 y≈102，与原设计稿波浪起伏范围（y 90~104.5）基本一致。
  -->
  <path fill="#000000" d="M0 95 Q46.875 110 93.75 95 T187.5 95 T281.25 95 T375 95 L375 118 L0 118 Z"/>
</svg>
